<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Azerst — Free Fire Event Tracker" />
  <meta name="theme-color" content="#d93828" />
  <title>Azerst — Events</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/loader.css" />
</head>
<body>

  <!-- LOADER -->
  <div id="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-emblem"><div class="loader-avatar">A</div></div>
      <div class="loader-name">AZERST</div>
      <div class="loader-sub">Events Hub</div>
      <div class="loader-bar"><div class="loader-bar-fill" id="barFill"></div></div>
      <div class="loader-percent" id="barPct">0%</div>
    </div>
  </div>

  <!-- HERO -->
  <header class="hero">
    <div class="card-wrapper">
      <article class="profile-card">
        <div class="hero-section">
          <h1 class="name">AZERST</h1>
          <div class="handle">FREE FIRE · EVENT TRACKER</div>
        </div>
      </article>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="content">
    <div class="content-inner">

      <!-- Toolbar -->
      <div class="toolbar">
        <button class="btn-refresh" id="btnRefresh" type="button">
          <span class="ico">↻</span> Tải lại
        </button>

        <!-- Custom dropdown server -->
        <div class="region-dropdown" id="regionDropdown">
          <button class="region-btn" id="regionBtn" type="button"
                  aria-haspopup="listbox" aria-expanded="false">
            <span class="region-current" id="regionCurrent">VN</span>
            <span class="region-arrow" aria-hidden="true"></span>
          </button>

          <ul class="region-list" id="regionList" role="listbox" aria-label="Chọn server">
            <li class="region-item selected" data-value="VN" role="option" aria-selected="true">VN</li>
            <li class="region-item" data-value="ID" role="option" aria-selected="false">ID</li>
            <li class="region-item" data-value="TH" role="option" aria-selected="false">TH</li>
            <li class="region-item" data-value="BR" role="option" aria-selected="false">BR</li>
            <li class="region-item" data-value="SG" role="option" aria-selected="false">SG</li>
          </ul>
        </div>
      </div>

      <div class="stat-line" id="statLine">—</div>

      <section id="eventsWrap" aria-live="polite" aria-busy="true">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </section>

    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/loader.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
